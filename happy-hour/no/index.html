<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Maybe next time! &middot; Kyle &amp; Co</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--ivory:#F7F1EA;--navy:#273752;--pink:#F8DDE8;--magenta:#B246AE}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    font-family:'Archivo',system-ui,sans-serif;color:var(--navy);
    background:rgba(39,55,82,.55)}
  .card{background:var(--ivory);border-radius:20px;max-width:420px;width:100%;padding:40px 32px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .emoji{font-size:56px;line-height:1;margin-bottom:16px}
  h1{font-size:28px;font-weight:800;margin:0 0 12px}
  p{font-size:17px;line-height:1.5;margin:0 0 12px}
  .pill{display:inline-block;background:var(--pink);border-radius:999px;padding:8px 18px;font-weight:600;font-size:15px;margin:8px 0 20px}
  a.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;border-radius:999px;padding:12px 26px}
</style>
</head>
<body>
  <main class="card" role="dialog" aria-labelledby="t">
    <div class="emoji">💌</div>
    <h1 id="t">Maybe next time!</h1>
    <p>Thanks for letting us know. We will keep you posted on what else we have coming up.</p>
    <a class="btn" href="https://kyleandco.com">Back to kyleandco.com</a>
  </main>
</body>
</html>
