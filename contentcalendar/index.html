  function b64d(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  async function decrypt(pass){
    var enc=new TextEncoder();
    var baseKey=await crypto.subtle.importKey("raw", enc.encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]);
    var key=await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b64d(ENC.salt), iterations:ENC.iter, hash:"SHA-256"},
      baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(ENC.iv)}, key, b64d(ENC.ct));
    return new TextDecoder().decode(pt);
  }
  var btn=document.getElementById("gbtn"), inp=document.getElementById("gpass"), err=document.getElementById("gerr");
  async function go(){
    var v=inp.value; if(!v) return;
    btn.disabled=true; err.textContent="Decrypting\u2026";
    try{
      var doc=await decrypt(v);
      try{ sessionStorage.setItem("kyleco_snap_pass", v); }catch(e){}

      document.open(); document.write(doc); document.close();
    }catch(e){

      inp.select();
    }

  inp.addEventListener("keydown", function(e){ if(e.key==="Enter") go(); });

  try{
